name: keep-backend-awake

# Pings the deployed backend's /health so Render's free tier doesn't spin
# it down after 15 min idle. Unlike the in-app self-ping (backend/app/
# keepalive.py), this runs from GitHub's infrastructure, so it also WAKES
# the service when it has already gone to sleep.
#
# Setup: add a repository variable BACKEND_URL with your Render service URL
#   Settings -> Secrets and variables -> Actions -> Variables -> New
#   e.g. https://drishti-api.onrender.com
# or edit the fallback in the run step below.
#
# Notes:
#  - GitHub may delay scheduled runs by 5-15 min under load.
#  - Scheduled workflows are auto-disabled after 60 days with no repo
#    activity; re-enable from the Actions tab.

on:
  schedule:
    - cron: "*/12 * * * *"   # roughly every 12 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (with wake-up retries)
        run: |
          URL="${{ vars.BACKEND_URL || 'https://drishti-api.onrender.com' }}"
          echo "Pinging ${URL}/api/v1/health"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "${URL}/api/v1/health" || true)
            echo "attempt ${i}: HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "backend is awake"
              exit 0
            fi
            sleep 20
          done
          echo "backend did not return 200 after retries"
          exit 1
