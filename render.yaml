# Render Blueprint for the DRISHTI backend (FastAPI + SSE).
# The frontend deploys separately on Vercel; the database is Supabase (PostGIS).
#
# In the Render dashboard, set the `sync: false` vars after the first deploy:
#   DATABASE_URL   - Supabase "Connection string" (Transaction pooler is fine);
#                    a bare postgres:// URL is auto-rewritten by app/config.py
#   CORS_ORIGINS   - your Vercel URL(s), comma-separated, e.g.
#                    https://drishti.vercel.app,https://drishti-git-main-you.vercel.app
#   LLM_API_KEY    - your Gemini API key (optional; chat falls back without it)
services:
  - type: web
    name: drishti-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker only — the SSE broker keeps state in-process. Migrations run
    # on boot (alembic is a no-op when already at head).
    startCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: ENVIRONMENT
        value: production
